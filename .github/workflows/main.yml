name: CoCoNut-was CI/CD with GitHub Actions

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - run: chmod +x ./gradlew

      - name: Build bootJar
        env:
          GRADLE_OPTS: -Xmx2048m
        run: ./gradlew clean bootJar -x test --no-daemon

      - name: Upload artifact (boot jar only)
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*-SNAPSHOT.jar

  deploy:
    needs: build
    if: github.event_name == 'push' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact to dist
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: dist

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "dist/*.jar"
          target: "/home/ubuntu/CoCoNut-was"

      - name: Deploy to EC2 using set-env.sh
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd /home/ubuntu/CoCoNut-was
            # 기존 앱 종료
            pgrep -f '\.jar' | xargs -r kill -9
            # 환경변수 로드
            source /home/ubuntu/CoCoNut-was/set-env.sh
            # 최신 JAR 선택
            JAR_NAME=$(ls -t *-SNAPSHOT.jar | head -n 1)
            # 서비스 실행
            nohup java -jar "$JAR_NAME" >/dev/null 2>&1 &
            sleep 2
            pgrep -f "$JAR_NAME" >/dev/null
