name: CoCoNut-was CI/CD with GitHub Actions

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'
      - run: chmod +x ./gradlew
      - name: Build with Gradle
        run: ./gradlew build -x test --no-daemon
        env:
          GRADLE_OPTS: -Xmx2048m

      # 'Get JAR file path' 단계를 삭제하고, Upload 단계에서 직접 경로를 지정합니다.
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar # *.jar 와일드카드로 직접 파일을 찾습니다.

  deploy:
    if: github.event_name == 'push' && needs.build.result == 'success'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "*.jar" # 다운로드된 폴더에서 .jar 파일을 찾아 복사합니다.
          target: "/home/ubuntu/CoCoNut-was"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/CoCoNut-was
            pgrep -f '.jar' | xargs -r kill -9
            JAR_NAME=$(ls -t *.jar | head -n 1)
            DB_URL="${{ secrets.DB_URL }}" \
            DB_USERNAME="${{ secrets.DB_USERNAME }}" \
            DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            SECRET_KEY="${{ secrets.SECRET_KEY }}" \
            OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            nohup java -jar $JAR_NAME > /dev/null 2>&1 &