# 워크플로우 이름
name: Deploy on develop merge

on:
  # 1) develop 브랜치로의 PR이 "닫힘" 이벤트 중 merge=true인 경우 (실제 배포)
  pull_request:
    branches: [ develop ]
    types: [ closed ]

  # 2) fix/cd 브랜치로 직접 push되는 경우 (실제 배포 테스트도 수행)
  push:
    branches:
      - fix/cd

jobs:
  deploy:
    # 실행 조건: (PR이 머지되었거나) 또는 (push 이벤트이고 브랜치가 fix/cd)
    # - pull_request.closed 이벤트에는 github.event.pull_request가 존재
    # - push 이벤트에는 github.ref가 'refs/heads/fix/cd'
    if: >
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
      || (github.event_name == 'push' && github.ref == 'refs/heads/fix/cd')

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1) 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # 2) JDK 설치 (+ Gradle 캐시)
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ secrets.JAVA_VERSION }}
          cache: gradle

      # 3) Gradle 설정(권장): gradle/actions/setup-gradle
      #    - 의존성 캐시/Config Cache를 안전하게 다루고 품질 향상
      #    - 구성 캐시 보존 시 암호화 키를 사용(옵션): secrets.GRADLE_CACHE_ENCRYPTION_KEY
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
        # 필요 시 구성 캐시까지 활용하려면 아래 키를 Secrets에 추가 후 주석 해제
        # cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
        # dependency-graph: generate-and-submit  # GitHub Dependabot용(선택)

      # 4) gradlew 실행 권한
      - name: Grant gradlew permission
        run: chmod +x gradlew

      # 5) 빌드 (테스트 스킵, 캐시 최적화 플래그)
      - name: Build bootJar
        run: ./gradlew clean bootJar -x test --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.caching=true -Dorg.gradle.daemon=false"

      # 6) 빌드 산출물 확인
      - name: List build outputs
        run: ls -l build/libs || true

      # 7) SSH 준비
      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      # 8) 원격 디렉터리 보장
      - name: Ensure remote dir
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "mkdir -p ${{ secrets.APP_DIR }}/build/libs"

      # 9) rsync로 업로드(사전 gzip 압축)
      - name: Compress and Upload JAR to EC2 with rsync
        run: |
          gzip -f build/libs/*-SNAPSHOT.jar
          rsync -avz -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
            build/libs/*-SNAPSHOT.jar.gz \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.APP_DIR }}/build/libs/

      # 10) 원격 배포 스크립트 실행(run.sh)
      #     - run.sh는 set-env.sh를 자동 로드하고, .jar.gz를 해제한 뒤 최신 JAR로 기동하도록 작성되어 있어야 합니다.
      - name: Restart app on EC2
        run: |
          ssh -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "cd ${{ secrets.APP_DIR }} && ./run.sh"

      # 11) 원격 상태 확인(선택)
      - name: Verify remote status
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "ps -ef | grep java | grep -v grep || true; \
             ss -lntp | grep ':8080' || true; \
             tail -n 100 ${{ secrets.APP_DIR }}/app.out || true"
