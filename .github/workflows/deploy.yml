# 워크플로우 이름
name: Deploy on develop merge

# 워크플로우 실행 조건 정의
on:
  # 1. (실제 배포) develop 브랜치로 Pull Request가 merge되면 자동 실행
  pull_request:
    branches: [ develop ]
    types: [ closed ]

  # 2. (테스트용) fix/cd 브랜치에 코드를 push하면 자동 실행
  push:
    branches:
      - fix/cd

jobs:
  deploy:
    # 실행 조건: PR이 merge되었거나, 또는 push된 브랜치가 fix/cd일 경우에만 실행
    if: github.event.pull_request.merged == true || github.ref == 'refs/heads/fix/cd'
    
    # 실행 환경: 최신 우분투
    runs-on: ubuntu-latest

    # 최대 실행 시간 20분 제한
    timeout-minutes: 20

    steps:
      # 1. 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # 2. JDK 17 설정
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ secrets.JAVA_VERSION }}

      # 3. Gradle 캐시 설정 (빌드 시간 단축!)
      # 의존성 라이브러리와 Gradle 실행 파일을 캐싱하여 반복 다운로드를 방지합니다.
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. gradlew 실행 권한 부여
      - name: Grant gradlew permission
        run: chmod +x gradlew

      # 5. 프로젝트 빌드 (테스트 제외)
      - name: Build bootJar
        run: ./gradlew clean bootJar -x test

      # 6. EC2 접속용 SSH 키 준비
      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      # 7. 압축 후 rsync로 JAR 파일 업로드 (업로드 시간 단축!)
      # scp 대신 압