name: CoCoNut-was CI/CD with GitHub Actions

on:
  push:
    branches: [ "develop" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3 #

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew # 3. gradlew 파일에 실행 권한을 부여합니다.

      - name: Build with Gradle
        run: ./gradlew build -x test # 4. Gradle로 프로젝트를 빌드합니다. (테스트는 제외)

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master # 5. appleboy의 ssh-action을 사용해 EC2에 접속합니다.
        with:
          host: ${{ secrets.EC2_HOST }} # GitHub Secrets에서 EC2 IP 주소를 가져옵니다.
          username: ${{ secrets.EC2_USERNAME }} # GitHub Secrets에서 EC2 사용자 이름을 가져옵니다.
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }} # GitHub Secrets에서 SSH 개인 키를 가져옵니다.
          script: |
            cd /home/ubuntu/CoCoNut-was
            
            pgrep -f '.jar' | xargs -r kill -9
            
            DB_URL="${{ secrets.DB_URL }}" \
            DB_USERNAME="${{ secrets.DB_USERNAME }}" \
            DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            SECRET_KEY="${{ secrets.SECRET_KEY }}" \
            OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            nohup java -jar build/libs/CoCoNut-was-0.0.1-SNAPSHOT.jar > /dev/null 2>&1 &