name: CoCoNut-was CI/CD with GitHub Actions

on:
  push:
    branches: [ "develop" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        env:
          GRADLE_OPTS: -Xmx2048m # Gradle이 사용하는 최대 메모리를 2GB로 제한
        run: ./gradlew build -x test --no-daemon # Daemon을 사용하지 않아 메모리 추가 절약

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/CoCoNut-was
            
            # 실행 중인 Java 프로세스가 있으면 종료합니다.
            pgrep -f '.jar' | xargs -r kill -9
            
            # 모든 환경변수를 주입하여 새 버전의 서버를 실행합니다.
            DB_URL="${{ secrets.DB_URL }}" \
            DB_USERNAME="${{ secrets.DB_USERNAME }}" \
            DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            SECRET_KEY="${{ secrets.SECRET_KEY }}" \
            OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            nohup java -jar build/libs/CoCoNut-was-0.0.1-SNAPSHOT.jar > /dev/null 2>&1 &